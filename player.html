<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player — AimBase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components/buttons.css">
<link rel="stylesheet" href="assets/css/components/forms.css">
<link rel="stylesheet" href="assets/css/components/profile-hero.css">
<link rel="stylesheet" href="assets/css/components/comments.css">
<link rel="stylesheet" href="assets/css/components/utility.css">
<link rel="stylesheet" href="assets/css/components/player-card-fifa.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/language-switcher.css">
</head>
<body data-page="profile" class="dark">
<header class="site-header">
  <a class="logo" href="index.html"><span class="logo-dot">A</span>Aim<span>Base</span></a>
  <nav class="top-nav"><a href="index.html" data-i18n="nav.home">Início</a><a class="active" href="#settings" data-i18n="nav.profile">Jogador</a></nav>
  <div class="header-tools">
    <div class="lang-switcher" data-lang-switcher>
      <button class="lang-current" type="button" aria-haspopup="listbox" aria-expanded="false"
        data-i18n-aria-label="lang.label" aria-label="Selecionar idioma">
        <span class="lang-flag" aria-hidden="true">🇧🇷</span>
        <span class="lang-name">Português</span>
        <span class="lang-caret" aria-hidden="true">▾</span>
      </button>
      <ul class="lang-menu" role="listbox" data-i18n-aria-label="lang.menuLabel" aria-label="Idiomas disponíveis">
        <li role="none"><button class="lang-option is-active" type="button" role="option" aria-selected="true" data-lang="pt-BR"><span class="lang-flag" aria-hidden="true">🇧🇷</span>Português</button></li>
        <li role="none"><button class="lang-option" type="button" role="option" aria-selected="false" data-lang="en"><span class="lang-flag" aria-hidden="true">🇺🇸</span>English</button></li>
        <li role="none"><button class="lang-option" type="button" role="option" aria-selected="false" data-lang="es"><span class="lang-flag" aria-hidden="true">🇪🇸</span>Español</button></li>
        <li role="none"><button class="lang-option" type="button" role="option" aria-selected="false" data-lang="fr"><span class="lang-flag" aria-hidden="true">🇫🇷</span>Français</button></li>
        <li role="none"><button class="lang-option" type="button" role="option" aria-selected="false" data-lang="de"><span class="lang-flag" aria-hidden="true">🇩🇪</span>Deutsch</button></li>
      </ul>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" data-i18n-aria-label="theme.label">☼</button>
  </div>
</header>
<main class="profile-layout">
  <a class="back-link" href="index.html#playerGrid" data-i18n="nav.back">← Voltar para jogadores</a>
  <section class="player-hero" id="playerHero">
    <div class="player-hero__card">
      <!-- Carta do jogador (renderizada por profile.js): personalizada p/ Pacheco, dinâmica p/ os demais -->
      <div id="fifaCard" aria-label="Carta do jogador"></div>
    </div>
    <div class="player-hero__info">
      <div class="breadcrumb">JOGADORES <span>/</span> VALORANT <span>/</span> <b id="crumbName"></b></div>
      <article class="profile-card">
        <div class="profile-photo" id="profilePhoto"></div>
        <div class="profile-info">
          <p class="kicker" data-i18n="profile.label">PERFIL DO JOGADOR</p>
          <h1 id="playerName"></h1>
          <p class="tag" id="playerTag"></p>
          <div class="profile-grid">
            <div><small data-i18n="profile.team">TIME</small><strong id="playerTeam"></strong></div>
            <div><small data-i18n="profile.role">FUNÇÃO</small><strong id="playerRole"></strong></div>
            <div><small data-i18n="profile.country">PAÍS</small><strong id="playerCountry"></strong></div>
          </div>
          <div class="profile-actions">
            <button class="copy-all" id="copySettings" type="button" data-i18n="profile.copySettings">Copiar settings</button>
            <button class="btn view-card-btn" id="viewCardBtn" type="button" data-i18n="profile.viewCard" hidden>Ver carta completa</button>
          </div>
        </div>
      </article>
    </div>
  </section>
  <section class="content" id="settings">
    <section class="settings-block">
      <div class="section-heading"><span class="section-icon">⌖</span><h2 data-i18n="settings.mouse">Mouse settings</h2></div>
      <div class="mouse-product"><span class="product-icon mouse-shape"></span><div><small data-i18n="settings.productMouse">MOUSE</small><strong id="mouseName"></strong></div><a id="mouseLink" href="#" target="_blank" rel="noopener" data-i18n="settings.viewProduct">Ver produto ↗</a></div>
      <div class="data-grid">
        <div><small data-i18n="settings.dpi">DPI</small><strong id="dpi"></strong></div>
        <div><small data-i18n="settings.sens">SENSIBILIDADE</small><strong id="sensitivity"></strong></div>
        <div><small data-i18n="settings.edpi">eDPI</small><strong id="edpi"></strong></div>
        <div><small data-i18n="settings.scoped">SCOPED SENS</small><strong>1.00</strong></div>
      </div>
    </section>
    <section class="settings-block crosshair-block">
      <div class="section-heading"><span class="section-icon">⌖</span><h2 data-i18n="settings.crosshair">Retícula</h2><button class="copy-code" id="crosshairCode" type="button" data-i18n="settings.copyCode">Copiar código</button></div>
      <div class="crosshair-preview"><img src="" data-i18n-aria-label="settings.crosshairAlt" alt="Prévia da retícula" id="crosshairImage"></div>
      <code id="crosshairText"></code>
    </section>
    <section class="settings-block" id="gear">
      <div class="section-heading"><span class="section-icon">◫</span><h2 data-i18n="settings.setup">Setup</h2></div>
      <div class="gear-grid">
        <a class="gear-card" id="keyboardLink" href="#" target="_blank" rel="noopener"><small data-i18n="settings.keyboard">TECLADO</small><strong id="keyboardName"></strong><span data-i18n="settings.viewProduct">Ver produto ↗</span></a>
        <a class="gear-card" id="mousepadLink" href="#" target="_blank" rel="noopener"><small data-i18n="settings.mousepad">MOUSEPAD</small><strong id="mousepadName"></strong><span data-i18n="settings.viewProduct">Ver produto ↗</span></a>
        <a class="gear-card" id="monitorLink" href="#" target="_blank" rel="noopener"><small data-i18n="settings.monitor">MONITOR</small><strong id="monitorName"></strong><span data-i18n="settings.viewProduct">Ver produto ↗</span></a>
      </div>
    </section>
  </section>
</main>
<dialog class="card-modal" id="cardModal" aria-label="Carta completa do jogador">
  <button type="button" class="close-modal card-modal__close" id="cardModalClose" aria-label="Fechar">✕</button>
  <div class="card-modal__body" id="cardModalBody"></div>
</dialog>
<div class="toast" id="toast"></div>
<script src="assets/i18n/i18n.js"></script>
<script src="data.js"></script>
<script src="shared.js"></script>
<script src="api.js"></script>
<script src="assets/js/attributes.js"></script>
<script src="profile.js"></script>
</body>
</html>
